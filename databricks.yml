# Databricks Asset Bundle — Contoso Lakehouse v2
bundle:
  name: contoso_lakehouse

include:
  - workflows/*.job.yml

variables:
  env:
    description: Doelomgeving (dev | tst | prd)
    default: dev
  storage_account:
    description: Storage account met het landing volume
    default: contosolake3
  landing_path:
    description: Omgevingsspecifiek pad binnen de landingcontainer
    default: sales
  source_system_id:
    description: Bronsysteem dat door de pipeline wordt verwerkt
    default: SALES
  bronze_parallelism:
    description: Maximale gelijktijdige Serverless Bronze-taken per bronsysteem
    default: 4
  demo_delivery_date:
    description: Datumfolder voor de handmatig gestarte demo-levering
    default: 2026-09-01
  service_principal:
    description: Service principal die de workflows uitvoert
    default: 22fb388c-33eb-46a3-8031-0cb4db20209d
  data_engineers_group:
    description: Accountgroep met data-engineerrechten
    default: grp_data_engineers
  bi_analysts_group:
    description: Accountgroep met leesrechten op Gold
    default: grp_bi_analysts
  data_stewards_group:
    description: Accountgroep met leesrechten op Reject
    default: grp_data_stewards

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405619535862062.2.azuredatabricks.net/
    variables:
      env: dev
      landing_path: sales
      data_engineers_group: stoelingabob@gmail.com
      bi_analysts_group: stoelingabob@gmail.com
      data_stewards_group: stoelingabob@gmail.com

  tst:
    mode: production
    workspace:
      host: https://adb-7405619535862062.2.azuredatabricks.net/
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: tst
      landing_path: sales/tst
    run_as:
      service_principal_name: ${var.service_principal}

  prd:
    mode: production
    workspace:
      host: https://adb-7405619535862062.2.azuredatabricks.net/
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prd
      landing_path: sales/prd
    run_as:
      service_principal_name: ${var.service_principal}
    permissions:
      - level: CAN_VIEW
        group_name: grp_data_engineers
