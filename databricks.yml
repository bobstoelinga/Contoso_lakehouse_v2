# Databricks Asset Bundle — Contoso Lakehouse v2
bundle:
  name: contoso_lakehouse

include:
  - workflows/*.job.yml

variables:
  env:
    description: Doelomgeving (dev | tst | prd)
    default: dev
  storage_account:
    description: Storage account met het landing volume
    default: contosolake
  source_system_id:
    description: Bronsysteem dat door de pipeline wordt verwerkt
    default: SALES
  service_principal:
    description: Service principal die de workflows uitvoert
    default: svc_contoso_etl
  node_type:
    default: Standard_D4ds_v5

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-0000000000000000.0.azuredatabricks.net
    variables:
      env: dev

  tst:
    mode: production
    workspace:
      host: https://adb-1111111111111111.1.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: tst
    run_as:
      service_principal_name: ${var.service_principal}

  prd:
    mode: production
    workspace:
      host: https://adb-2222222222222222.2.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prd
      node_type: Standard_D8ds_v5
    run_as:
      service_principal_name: ${var.service_principal}
    permissions:
      - level: CAN_VIEW
        group_name: grp_data_engineers
