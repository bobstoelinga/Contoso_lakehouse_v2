# Databricks Asset Bundle — Contoso Lakehouse v2
bundle:
  name: contoso_lakehouse

include:
  - workflows/*.job.yml

variables:
  env:
    description: Doelomgeving (dev | tst | prd)
    default: dev
  storage_account:
    description: Storage account met het landing volume
    default: contosolake
  source_system_id:
    description: Bronsysteem dat door de pipeline wordt verwerkt
    default: SALES
  service_principal:
    description: Service principal die de workflows uitvoert
    default: svc_contoso_etl

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405619535862062.2.azuredatabricks.net/
    variables:
      env: dev

  tst:
    mode: production
    workspace:
      host: https://adb-7405619535862062.2.azuredatabricks.net/
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: tst
    run_as:
      service_principal_name: ${var.service_principal}

  prd:
    mode: production
    workspace:
      host: https://adb-7405619535862062.2.azuredatabricks.net/
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prd
    run_as:
      service_principal_name: ${var.service_principal}
    permissions:
      - level: CAN_VIEW
        group_name: grp_data_engineers
