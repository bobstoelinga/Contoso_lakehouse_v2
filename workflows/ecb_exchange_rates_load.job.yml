# Zelfstandig end-to-end laadproces voor ECB-wisselkoersen.
resources:
  jobs:
    load_ecb_exchange_rates:
      name: "[${var.env}] Contoso - Load ECB Exchange Rates"
      description: "Extract -> Bronze -> Quality -> Reference Data -> Gold voor ECB."
      max_concurrent_runs: 1
      parameters:
        - name: delivery_date
          default: ""
      tasks:
        - task_key: extract_ecb
          run_job_task:
            job_id: ${resources.jobs.extract_public_api.id}
            job_parameters:
              source_object_id: ECB.EXCHANGE_RATE
              delivery_date: "{{job.parameters.delivery_date}}"
        - task_key: load_ecb_to_gold
          depends_on: [{ task_key: extract_ecb }]
          run_job_task:
            job_id: ${resources.jobs.contoso_lakehouse_pipeline.id}
            job_parameters:
              source_system_id: ECB