resources:
  jobs:
    load_fabric_sales_order_lines:
      name: "[${var.env}] Contoso - Load Fabric Sales Order Lines"
      description: "Fabric SQL extract -> Bronze -> Quality -> Reference Data -> Gold."
      max_concurrent_runs: 1
      parameters:
        - name: delivery_date
          default: ""
      tasks:
        - task_key: extract_fabric_sql
          notebook_task:
            notebook_path: ../notebooks/11_extract_fabric_sql.py
            base_parameters:
              env: ${var.env}
              source_object_id: FABRIC_SALES.ORDER_LINES
              delivery_date: "{{job.parameters.delivery_date}}"
              repo_root: ${workspace.file_path}
        - task_key: load_to_gold
          depends_on: [{ task_key: extract_fabric_sql }]
          run_job_task:
            job_id: ${resources.jobs.contoso_lakehouse_pipeline.id}
            job_parameters:
              source_system_id: FABRIC_SALES