# Onderhoud: OPTIMIZE, VACUUM en retentie. Metadata-gedreven over alle catalogs.
resources:
  jobs:
    lakehouse_maintenance:
      name: "[${var.env}] Contoso — Lakehouse Maintenance"
      description: >-
        Wekelijks onderhoud. Zonder deze job groeien transactielogs en
        small files onbeheersbaar bij dagelijkse leveringen.
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 3 ? * SUN"
        timezone_id: Europe/Amsterdam

      tasks:
        - task_key: optimize_and_vacuum
          notebook_task:
            notebook_path: ../notebooks/90_maintenance.py
            base_parameters:
              env: ${var.env}
              repo_root: ${workspace.file_path}
