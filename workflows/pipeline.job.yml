# Continue, metadata-gedreven pipeline.
#
# Ontwerpbesluit: de Workflow-graaf bevat GEEN inhoudelijke afhankelijkheden.
# De taken vormen alleen de lagen; welke entiteiten binnen een laag draaien en in
# welke volgorde, komt uit meta_dependency. Een nieuw bronobject of een nieuwe
# satellite vereist dus geen wijziging in dit bestand.
resources:
  jobs:
    contoso_lakehouse_pipeline:
      name: "[${var.env}] Contoso — Lakehouse Pipeline"
      description: >-
        Volume -> Bronze -> gate -> Quality/Reject -> Data Vault -> Business Vault
        -> Gold Historisch -> Gold Actueel.
      max_concurrent_runs: 1
      timeout_seconds: 14400

      trigger:
        # Auto Loader start Bronze zodra er bestanden in het landing volume staan.
        file_arrival:
          url: "/Volumes/raw_${var.env}/sales/landing/"
          min_time_between_triggers_seconds: 300
          wait_after_last_change_seconds: 120

      email_notifications:
        on_failure:
          - data-platform-alerts@contoso.com

      tasks:
        # ------------------------------------------------------------------
        - task_key: validate_metadata
          notebook_task:
            notebook_path: ../notebooks/99_validate_metadata.py
            base_parameters:
              env: ${var.env}
              repo_root: ${workspace.file_path}

        # ------------------------------------------------------------------
        - task_key: plan_bronze_fanout
          depends_on: [{ task_key: validate_metadata }]
          notebook_task:
            notebook_path: ../notebooks/06_plan_bronze_fanout.py
            base_parameters:
              env: ${var.env}
              source_system_id: ${var.source_system_id}
              repo_root: ${workspace.file_path}

        # ------------------------------------------------------------------
        - task_key: bronze_ingest
          depends_on: [{ task_key: plan_bronze_fanout }]
          for_each_task:
            inputs: "{{tasks.plan_bronze_fanout.values.bronze_inputs}}"
            concurrency: ${var.bronze_parallelism}
            task:
              task_key: bronze_object
              max_retries: 3
              min_retry_interval_millis: 60000
              notebook_task:
                notebook_path: ../notebooks/10_bronze_autoloader.py
                base_parameters:
                  env: ${var.env}
                  source_system_id: ${var.source_system_id}
                  source_object_id: "{{input.source_object_id}}"
                  batch_id: "{{tasks.plan_bronze_fanout.values.batch_id}}"
                  mode: once
                  repo_root: ${workspace.file_path}

        # ------------------------------------------------------------------
        - task_key: delivery_gate
          depends_on: [{ task_key: bronze_ingest }]
          notebook_task:
            notebook_path: ../notebooks/05_delivery_gate.py
            base_parameters:
              env: ${var.env}
              source_system_id: ${var.source_system_id}
              batch_id: "{{tasks.plan_bronze_fanout.values.batch_id}}"
              repo_root: ${workspace.file_path}

        # Vervolgverwerking alleen als de levering compleet is.
        - task_key: gate_is_open
          depends_on: [{ task_key: delivery_gate }]
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.delivery_gate.values.gate_open}}"
            right: "true"

        # ------------------------------------------------------------------
        - task_key: quality
          depends_on: [{ task_key: gate_is_open, outcome: "true" }]
          notebook_task:
            notebook_path: ../notebooks/20_quality.py
            base_parameters:
              env: ${var.env}
              source_system_id: ${var.source_system_id}
              delivery_id: "{{tasks.delivery_gate.values.delivery_id}}"
              batch_id: "{{tasks.delivery_gate.values.batch_id}}"
              repo_root: ${workspace.file_path}

        # ------------------------------------------------------------------
        - task_key: raw_vault
          depends_on: [{ task_key: quality }]
          notebook_task:
            notebook_path: ../notebooks/30_data_vault.py
            base_parameters:
              env: ${var.env}
              zone: RAW_VAULT
              delivery_id: "{{tasks.delivery_gate.values.delivery_id}}"
              batch_id: "{{tasks.delivery_gate.values.batch_id}}"
              repo_root: ${workspace.file_path}

        - task_key: business_vault
          depends_on: [{ task_key: raw_vault }]
          notebook_task:
            notebook_path: ../notebooks/30_data_vault.py
            base_parameters:
              env: ${var.env}
              zone: BUSINESS_VAULT
              delivery_id: "{{tasks.delivery_gate.values.delivery_id}}"
              batch_id: "{{tasks.delivery_gate.values.batch_id}}"
              repo_root: ${workspace.file_path}

        # ------------------------------------------------------------------
        - task_key: gold_historical
          depends_on: [{ task_key: business_vault }]
          notebook_task:
            notebook_path: ../notebooks/40_gold_historical.py
            base_parameters:
              env: ${var.env}
              delivery_id: "{{tasks.delivery_gate.values.delivery_id}}"
              batch_id: "{{tasks.delivery_gate.values.batch_id}}"
              repo_root: ${workspace.file_path}

        # Publiceert pas als de volledige publication group gebouwd is.
        # Faalt deze taak, dan blijft de vorige Gold Actueel versie actief.
        - task_key: gold_current
          depends_on: [{ task_key: gold_historical }]
          notebook_task:
            notebook_path: ../notebooks/41_gold_current.py
            base_parameters:
              env: ${var.env}
              delivery_id: "{{tasks.delivery_gate.values.delivery_id}}"
              batch_id: "{{tasks.delivery_gate.values.batch_id}}"
              repo_root: ${workspace.file_path}
