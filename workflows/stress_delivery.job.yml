# Handmatige utility-job voor een representatieve, positieve stresslevering.
resources:
  jobs:
    generate_stress_delivery:
      name: "[${var.env}] Contoso - Generate Stress Delivery"
      description: >-
        Schrijft een schaalbare, referentieel geldige Sales-levering naar het
        landing volume. De doel-folder wordt nooit overschreven.
      max_concurrent_runs: 1

      parameters:
        - name: delivery_date
          default: ${var.stress_delivery_date}
        - name: business_date
          default: "2024-09-02"
        - name: customer_count
          default: "100000"
        - name: product_count
          default: "50000"
        - name: employee_count
          default: "10000"
        - name: order_count
          default: "1000000"
        - name: return_count
          default: "20000"
        - name: change_set
          default: "0"

      tasks:
        - task_key: generate_delivery
          notebook_task:
            notebook_path: ../notebooks/02_generate_stress_delivery.py
            base_parameters:
              env: ${var.env}
              delivery_date: "{{job.parameters.delivery_date}}"
              business_date: "{{job.parameters.business_date}}"
              customer_count: "{{job.parameters.customer_count}}"
              product_count: "{{job.parameters.product_count}}"
              employee_count: "{{job.parameters.employee_count}}"
              order_count: "{{job.parameters.order_count}}"
              return_count: "{{job.parameters.return_count}}"
              change_set: "{{job.parameters.change_set}}"